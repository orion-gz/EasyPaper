name: Tauri Release

# 태그 push(v*) 또는 수동 트리거로 win/mac-arm64/linux 3개 플랫폼을
# 빌드해 GitHub Release에 업로드하고, Tauri updater가 읽는 latest.json도
# 함께 생성한다. TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)로 업데이트 페이로드에
# 서명하지만, OS 코드사이닝(macOS 공증/Windows Authenticode)은 아직 하지
# 않으므로 설치 시 Gatekeeper/SmartScreen 경고가 뜬다 - 유료 인증서 발급
# 후 별도로 추가 필요.
#
# macos-13(Intel) 러너는 GitHub Actions 큐에서 몇 시간째 시작되지 않는
# 문제(용량 부족/단종 추정)로 인해 매트릭스에서 제외했다 - macOS Intel
# 빌드가 다시 필요하면 macos-13 대신 다른 macOS 러너 이미지를 확인할 것.
#
# v* 태그 push는 빌드가 끝나면 릴리스를 즉시 게시(draft=false)한다 - 실제
# 배포 트리거이므로 사람이 다시 "Publish" 버튼을 누르지 않아도 updater
# 엔드포인트(releases/latest/download/latest.json)가 바로 응답하게 하기
# 위함. workflow_dispatch(수동 테스트 빌드)는 실수로 공개 릴리스가 되지
# 않도록 계속 초안(draft)으로 남긴다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage linuxdeploy가 ubuntu-latest에서 반복 실패하므로 Tauri의
          # 공식 tauri-action 릴리스 예시와 동일하게 22.04에 고정한다.
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 태그 push 시점의 "직전 태그"를 찾아 릴리스 노트를 커밋 메시지로
          # 자동 생성하려면 태그 히스토리 전체가 필요하다(기본 얕은 클론은
          # 태그를 안 가져옴).
          fetch-depth: 0

      - name: Generate release notes from commits since previous tag
        id: relnotes
        shell: bash
        run: |
          current_tag="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          prev_tag=$(git tag --list 'v*' --sort=-creatordate | grep -vFx "$current_tag" | head -n1 || true)
          range=HEAD
          if [ -n "$prev_tag" ]; then
            range="$prev_tag..HEAD"
          fi

          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "자동 생성된 릴리스입니다. 코드사이닝(macOS 공증/Windows Authenticode)이"
            echo "아직 적용되지 않아 설치 시 운영체제 보안 경고가 뜹니다. 아래 실행 방법을"
            echo "꼭 확인해주세요."
            echo ""
            echo "## 실행 방법"
            echo ""
            echo "**macOS**: 앱이 완전히 서명되지 않은 상태라 최신 macOS(Ventura 이후)에서는"
            echo "우클릭 → 열기로 우회되지 않고 \"앱이 손상되었기 때문에 열 수 없습니다\" 라는"
            echo "오해의 소지가 있는 메시지가 뜹니다. 실제로 파일이 손상된 게 아니라 다운로드"
            echo "시 붙는 quarantine 속성 때문이니, 터미널에서 아래 명령으로 지운 뒤 다시"
            echo "실행하세요."
            echo '```bash'
            echo "xattr -cr /Applications/EasyPaper.app"
            echo '```'
            echo ""
            echo "**Windows**: \"Windows의 PC 보호\" 화면에서 **추가 정보 → 실행**을 선택하면"
            echo "정상적으로 설치됩니다."
            echo ""
            echo "## 변경 사항"
            commits=$(git log "$range" --no-merges --pretty=format:'%s' | grep -E '^(feat|fix|perf)(\(.+\))?:' || true)
            if [ -n "$commits" ]; then
              echo "$commits" | sed 's/^/- /'
            else
              echo "- 세부 변경 내역 없음"
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build sidecar binary (PyInstaller onedir, frontend dist bundled)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            backend/packaging/build.bat
          else
            backend/packaging/build.sh
          fi

      - name: Copy sidecar into src-tauri/binaries
        shell: bash
        run: src-tauri/scripts/copy-sidecar.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install root deps (Tauri CLI)
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-manual{0}', github.run_number) }}
          releaseName: "EasyPaper Desktop ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}"
          releaseBody: ${{ steps.relnotes.outputs.notes }}
          # 태그 push만 즉시 게시하고, workflow_dispatch 수동 빌드는 검토 전
          # 실수로 공개되지 않도록 초안으로 남긴다.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: false
