name: Tauri Sidecar Smoke Test

# 수동 트리거만 사용 - 기존 웹 배포(systemd/Docker) 파이프라인에는 전혀
# 개입하지 않는다. tauri-desktop-spike 브랜치는 main에 병합되어 데스크탑
# 지원이 정식화됐고(tauri-release.yml이 실제 서명/배포까지 담당), 이
# 워크플로우는 그 무거운 릴리스 빌드 없이도 "PyInstaller sidecar가 정상
# 기동해 응답하는지 + Rust가 컴파일되는지"를 빠르게 확인하는 스모크
# 테스트로 계속 남겨둔다(tauri-release.yml에는 이 healthcheck/cargo
# check 단계가 없음).
on:
  workflow_dispatch: {}

jobs:
  test-macos-webkit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install frontend dependencies and WebKit
        working-directory: frontend
        run: |
          npm ci
          npx playwright install webkit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test PDF rendering with WebKit
        working-directory: frontend
        run: npm run test:e2e:webkit -- tests/e2e/pdf-text-layer-alignment.spec.js tests/e2e/pdf-text-geometry.spec.js tests/e2e/pdf-viewer-race.spec.js

  build-sidecar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + PyInstaller
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Build frontend (needed for sidecar's bundled dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build sidecar binary (PyInstaller onedir)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            backend/packaging/build.bat
          else
            backend/packaging/build.sh
          fi

      - name: Packaged PDF parser installer smoke test
        shell: bash
        run: |
          BIN=backend/packaging/dist/easypaper-backend/easypaper-backend
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="backend/packaging/dist/easypaper-backend/easypaper-backend.exe"
          fi
          PARSER_CONFIG="${{ runner.temp }}/easypaper-parser-smoke"
          EASYPAPER_CONFIG_DIR="$PARSER_CONFIG" \
          EASYPAPER_DESKTOP=1 \
          "$BIN" --easypaper-install-pdf-parser pdfplumber
          test -d "$PARSER_CONFIG/pdf-parser-packages/pdfplumber/pdfplumber"

      - name: Standalone healthcheck (no GUI needed)
        shell: bash
        run: |
          set -e
          BIN=backend/packaging/dist/easypaper-backend/easypaper-backend
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="backend/packaging/dist/easypaper-backend/easypaper-backend.exe"
          fi
          APP_HOST=127.0.0.1 APP_PORT=18123 \
          EASYPAPER_CONFIG_DIR="${{ runner.temp }}/easypaper-appdata" \
          "$BIN" &
          SIDECAR_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18123/ >/dev/null; then
              echo "healthcheck OK"
              kill "$SIDECAR_PID" || true
              exit 0
            fi
            sleep 1
          done
          echo "healthcheck FAILED after 30s"
          kill "$SIDECAR_PID" || true
          exit 1

      - name: Copy sidecar into src-tauri/binaries
        shell: bash
        run: src-tauri/scripts/copy-sidecar.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install root deps (Tauri CLI)
        run: npm ci

      - name: cargo check (src-tauri)
        working-directory: src-tauri
        run: cargo check
