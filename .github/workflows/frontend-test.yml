name: Frontend Test

on:
  workflow_call:
    inputs:
      skip_macos:
        description: Skip desktop WebKit checks for server-only deployment
        type: boolean
        default: false
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-test.yml"
      - ".github/workflows/deploy.yml"
  # main pushes are already checked through Deploy to Server's workflow_call.
  # Keep full Chromium + macOS validation available without deploying.
  workflow_dispatch: {}

permissions:
  contents: read

# Cancel superseded PR runs, but let deployment callers finish their checks.
concurrency:
  group: frontend-test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
          if-no-files-found: error

  chromium-e2e:
    needs: unit-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=2

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  macos-pdf-geometry:
    if: ${{ !inputs.skip_macos }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and WebKit
        working-directory: frontend
        run: |
          npm ci
          npx playwright install webkit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify PDF geometry and workspace on macOS WebKit
        working-directory: frontend
        run: npm run test:e2e:webkit -- tests/e2e/pdf-text-geometry.spec.js tests/e2e/pdf-text-layer-alignment.spec.js tests/e2e/pdf-viewer-race.spec.js tests/e2e/focus-isolation.spec.js tests/e2e/pdf-text-recovery.spec.js tests/e2e/workspace-tabs.spec.js tests/e2e/workspace-csp.spec.js tests/e2e/viewer-memo.spec.js tests/e2e/viewer-capture.spec.js tests/e2e/citation-links.spec.js tests/e2e/viewer-reading-position.spec.js tests/e2e/viewer-chat-scale.spec.js tests/e2e/custom-themes.spec.js tests/e2e/translation-policy.spec.js --workers=2
      - name: Upload PDF geometry failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pdf-geometry-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
