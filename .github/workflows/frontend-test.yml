name: Frontend Test

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-test.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-test.yml"

permissions:
  contents: read

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  macos-pdf-geometry:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and WebKit
        working-directory: frontend
        run: |
          npm ci
          npx playwright install webkit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify PDF geometry on macOS WebKit
        working-directory: frontend
        run: npm run test:e2e:webkit -- tests/e2e/pdf-text-geometry.spec.js tests/e2e/pdf-text-layer-alignment.spec.js tests/e2e/pdf-viewer-race.spec.js --workers=2
      - name: Upload PDF geometry failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-pdf-geometry-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
